<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/generated/brain-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Who Has The Biggest Brain?</title>
    <style>
      body { margin: 0; background: #0a0e2a; }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at 50% 30%, #161a3a, #0a0e2a);
        z-index: 9999;
        transition: opacity 0.4s;
      }
      #splash.fade-out { opacity: 0; pointer-events: none; }
      #splash-text {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        color: rgba(255,255,255,0.3);
        letter-spacing: 4px;
        text-transform: uppercase;
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.7; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div id="splash-text">Loading...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Fade out splash once React mounts
      window.addEventListener('DOMContentLoaded', () => {
        const splash = document.getElementById('splash');
        const observer = new MutationObserver(() => {
          const root = document.getElementById('root');
          if (root && root.children.length > 0) {
            splash.classList.add('fade-out');
            setTimeout(() => splash.remove(), 500);
            observer.disconnect();
          }
        });
        observer.observe(document.getElementById('root'), { childList: true });
      });
    </script>
  </body>
</html>
